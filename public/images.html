<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Images Upload</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .chessboard-bg {
    background-color: #ecfdf5;
    background-image:
      linear-gradient(45deg, rgba(22, 101, 52, 0.06) 25%, transparent 25%),
      linear-gradient(-45deg, rgba(22, 101, 52, 0.06) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, rgba(22, 101, 52, 0.06) 75%),
      linear-gradient(-45deg, transparent 75%, rgba(22, 101, 52, 0.06) 75%);
    background-size: 56px 56px;
    background-position: 0 0, 0 28px, 28px -28px, -28px 0px;
  }

  .card-hover {
    transition: transform 180ms ease, box-shadow 180ms ease;
  }
  .card-hover:hover {
    transform: translateY(-2px);
    box-shadow: 0 16px 30px rgba(29, 38, 59, 0.1);
  }
</style>
</head>
<body class="chessboard-bg font-sans text-gray-900">


<div class="flex min-h-screen">

 
   <!-- SIDEBAR -->
  <aside class="w-64 bg-white text-green-900 flex flex-col p-6 border-r border-emerald-100 shadow-sm">
    <h1 class="text-xl font-bold mb-8">Academy Admin</h1>

    <nav class="flex-1 space-y-1">
      <a href="dashboard.html" class="block px-4 py-2 rounded hover:bg-green-700">Dashboard</a>
      <a href="coaches.html" class="block px-4 py-2 rounded hover:bg-green-700">Manage Coaches</a>
      <a href="students.html" class="block px-4 py-2 rounded bg-hover:bg-green-700">Manage Students</a>
   
      
      <a href="whatsapp.html" class="block px-4 py-2 rounded hover:bg-green-700">WhatsApp Reminder</a>
 <a href="fees.html" class="block px-4 py-2 rounded hover:bg-green-700">fess Collection</a>
      <a href="Aattendance.html" class="block px-4 py-2 rounded hover:bg-green-700">Attendance</a>
<a href="payroll.html" class="block py-3 px-4 rounded hover:bg-green-700">Payroll</a>
      <a href="reports.html" class="block px-4 py-2 rounded hover:bg-green-700">Reports</a>
      <a href="settings.html" class="block px-4 py-2 rounded hover:bg-green-700">Settings</a>
    </nav>

    <button onclick="logout()"
      class="bg-red-600 py-2 rounded mt-6 hover:bg-red-700">
      Logout
    </button>
  </aside>

  <main class="flex-1 p-8">
    <h2 class="text-3xl font-bold mb-6">Upload Images</h2>

    <div class="bg-white p-6 rounded-xl shadow-md max-w-lg">
      <label class="block mb-2 font-medium">Select Image</label>
      <input type="file" class="w-full mb-4">

      <button class="bg-green-600 text-white px-5 py-2 rounded-lg hover:bg-green-700 transition">Upload</button>
    </div>
  </main>
</div>
<script>
function logout() {
  if (confirm("Are you sure you want to logout?")) {
    window.location.href = "admin-login.html";
  }
}
</script>
</body>
</html>
