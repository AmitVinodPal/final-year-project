<!DOCTYPE html>
<html>
<head>
  <title>Gurukul Chess</title>

  <link rel="stylesheet" href="css/style.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #e6f4ea, #c9f2d0);
      text-align: center;
    }

    h1 {
      margin-top: 40px;
      font-size: 40px;
      color: #0a7d2c;
    }

    .subtitle {
      color: #444;
      margin-bottom: 30px;
    }

    .menu {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      padding: 20px;
    }

    .card {
      width: 200px;
      padding: 20px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-decoration: none;
      color: black;
      transition: all 0.3s;
    }

    .card:hover {
      transform: translateY(-8px) scale(1.05);
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    .card h3 {
      margin-bottom: 10px;
      color: #0a7d2c;
    }

    .play-btn {
      margin-top: 40px;
      padding: 15px 25px;
      font-size: 18px;
      background: #0a7d2c;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    .play-btn:hover {
      background: #055a1f;
      transform: scale(1.1);
    }
  </style>
</head>

<body>

<h1>♟ Gurukul Chess Trainer</h1>
<p class="subtitle">Learn • Play • Master Chess in a fun way 🚀</p>

<div class="menu">

  <a href="level1.html" class="card">
    <h3>Level 1</h3>
    <p>Learn how pieces move</p>
  </a>

  <a href="level2.html" class="card">
    <h3>Level 2</h3>
    <p>Capture opponent pieces</p>
  </a>

  <a href="level3.html" class="card">
    <h3>Level 3</h3>
    <p>Solve puzzles & tactics</p>
  </a>

  <a href="level4.html" class="card">
    <h3>Level 4</h3>
    <p>Play vs AI 🤖</p>
  </a>

</div>

<button class="play-btn" onclick="startGame()">🎮 Start Playing</button>

<script>
function startGame() {
  window.location.href = "level1.html";
}
</script>

</body>
</html>
