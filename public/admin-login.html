<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login – Gurukul Chess Academy</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: "Inter", sans-serif; }
        
        .chessboard-bg {
            background-color: #ecfdf5; /* very light green */
            background-image:
                linear-gradient(45deg, rgba(22, 101, 52, 0.06) 25%, transparent 25%),
                linear-gradient(-45deg, rgba(22, 101, 52, 0.06) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, rgba(22, 101, 52, 0.06) 75%),
                linear-gradient(-45deg, transparent 75%, rgba(22, 101, 52, 0.06) 75%);
            background-size: 56px 56px;
            background-position: 0 0, 0 28px, 28px -28px, -28px 0px;
        }
        
        .card-hover {
            transition: transform 180ms ease, box-shadow 180ms ease;
        }
        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 30px rgba(29, 38, 59, 0.1);
        }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center bg-cover bg-center"
      style="background-image: url('images/background.jpg');">

    <!-- HEADER -->
    <div class="text-center mt-10">
        <div class="flex justify-center items-center gap-4">
            <img src="images/logo.jpg" class="w-20" alt="Logo">
            <h1 class="text-4xl font-extrabold text-green-900">GURUKUL CHESS ACADEMY</h1>
        </div>

        <p class="mt-3 text-xl font-semibold text-gray-800">
            EVERY CHESS MASTER WAS ONCE A BEGINNER
        </p>
        <p class="text-gray-600 font-medium">– IRVING CHERNEV</p>

        <div class="flex justify-center items-center mt-6">
            <div class="border-t-2 border-gray-600 w-64"></div>
            <span class="px-3 text-2xl text-gray-700">♟</span>
            <div class="border-t-2 border-gray-600 w-64"></div>
        </div>
    </div>

    <!-- LOGIN CARD -->
    <div class="w-full max-w-lg bg-white shadow-xl rounded-2xl p-10 border-t-4 border-green-700 mt-8">

        <div class="flex items-center gap-2 mb-6 justify-center">
            <i data-lucide="log-in" class="w-7 h-7 text-green-700"></i>
            <h2 class="text-2xl font-bold text-gray-900">Admin Login</h2>
        </div>

        <form onsubmit="adminLogin(event)" class="space-y-6">

            <!-- Username -->
            <div class="relative">
                <i data-lucide="user" class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500"></i>
                <input id="adminId" type="text" placeholder="Enter Username"
                       class="w-full pl-10 p-3 border-b-2 border-gray-300 focus:border-green-700 outline-none"
                       required>
            </div>

            <!-- Password -->
            <div class="relative">
                <i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500"></i>
                <input id="adminPass" type="password" placeholder="Enter Password"
                       class="w-full pl-10 p-3 border-b-2 border-gray-300 focus:border-green-700 outline-none"
                       required>

                <button type="button" onclick="togglePassword()"
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500">
                    <i id="eyeIcon" data-lucide="eye-off"></i>
                </button>
            </div>

            <!-- Button -->
            <button type="submit"
                    class="w-full bg-green-700 text-white font-semibold py-3 rounded-xl hover:bg-green-800 shadow-md">
                Proceed to Branches
            </button>
        </form>
    </div>

    <script>
        lucide.createIcons();

        function togglePassword() {
            const pass = document.getElementById("adminPass");
            const icon = document.getElementById("eyeIcon");
            pass.type = pass.type === "password" ? "text" : "password";
            icon.setAttribute("data-lucide", pass.type === "password" ? "eye-off" : "eye");
            lucide.createIcons();
        }

        function adminLogin(e) {
            e.preventDefault();
            let id = adminId.value.trim();
            let pass = adminPass.value.trim();

            if (id === "admin" && pass === "password") {
                window.location.href = "dashboard.html";   // 🔥 Redirect to Branch Selection Page
            } else {
                alert("Invalid Credentials!");
            }
        }
    </script>

</body>
</html>
