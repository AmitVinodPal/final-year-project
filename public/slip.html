<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monthly Payslip</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
.chessboard-bg {
  background-color: #ecfdf5;
  background-image:
    linear-gradient(45deg, rgba(22, 101, 52, 0.06) 25%, transparent 25%),
    linear-gradient(-45deg, rgba(22, 101, 52, 0.06) 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, rgba(22, 101, 52, 0.06) 75%),
    linear-gradient(-45deg, transparent 75%, rgba(22, 101, 52, 0.06) 75%);
  background-size: 56px 56px;
  background-position: 0 0, 0 28px, 28px -28px, -28px 0px;
}

.card-hover {
  transition: transform 180ms ease, box-shadow 180ms ease;
}
.card-hover:hover {
  transform: translateY(-2px);
  box-shadow: 0 16px 30px rgba(29, 38, 59, 0.1);
}

@media print {
  button {
    display: none;
  }
  body {
    background: white;
  }
}
</style>

</head>

<body class="chessboard-bg font-sans text-gray-900">

<div class="max-w-4xl mx-auto bg-white p-8 shadow rounded">

  <!-- Header -->
  <div class="flex justify-between items-center mb-6">
    <div>
      <h1 class="text-2xl font-bold">Academy Coach Payslip</h1>
      <p class="text-gray-600">Month: <span id="monthText"></span></p>
    </div>
    <div class="text-right">
      <p class="font-semibold">Coach Name:</p>
      <p id="coachName" class="text-gray-700"></p>
    </div>
  </div>

  <!-- Table -->
  <table class="w-full border border-gray-300">
    <thead class="bg-gray-100">
      <tr>
        <th class="p-2 border">Date</th>
        <th class="p-2 border">Session Type</th>
        <th class="p-2 border">Hours</th>
        <th class="p-2 border">Rate ₹</th>
        <th class="p-2 border">Amount ₹</th>
      </tr>
    </thead>
    <tbody id="slipTable"></tbody>
  </table>

  <!-- Summary -->
  <div class="mt-6 text-right">
    <p class="text-lg font-semibold">
      Total Sessions: <span id="totalSessions">0</span>
    </p>
    <p class="text-lg font-semibold">
      Total Hours: <span id="totalHours">0</span>
    </p>
    <p class="text-2xl font-bold mt-2">
      Total Salary: ₹<span id="totalSalary">0</span>
    </p>
  </div>

  <!-- Print Button -->
  <div class="mt-8 text-center">
    <button onclick="window.print()"
      class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">
      Download / Save as PDF
    </button>
  </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", async () => {

  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");
  const month = params.get("month");

  if (!id) {
    alert("Invalid Payslip");
    return;
  }

  document.getElementById("monthText").textContent = month;

  try {
    const response = await fetch(`/api/download-payslip/${id}`);
    const data = await response.json();

    const table = document.getElementById("slipTable");

    let totalSalary = 0;
    let totalHours = 0;
    let totalSessions = 0;

    document.getElementById("coachName").textContent = data.coachName;

    data.sessions.forEach(session => {

      const amount = session.hours * session.rate;
      totalSalary += amount;
      totalHours += session.hours;
      totalSessions++;

      table.innerHTML += `
        <tr>
          <td class="p-2 border">${session.date}</td>
          <td class="p-2 border">${session.session}</td>
          <td class="p-2 border">${session.hours}</td>
          <td class="p-2 border">₹${session.rate}</td>
          <td class="p-2 border">₹${amount}</td>
        </tr>
      `;
    });

    document.getElementById("totalSalary").textContent = totalSalary;
    document.getElementById("totalHours").textContent = totalHours;
    document.getElementById("totalSessions").textContent = totalSessions;

  } catch (error) {
    console.error("Error loading payslip:", error);
    alert("Error loading payslip");
  }

});
</script>

</body>
</html>
