<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coach Payslip</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
.chessboard-bg {
  background-color: #ecfdf5;
  background-image:
    linear-gradient(45deg, rgba(22, 101, 52, 0.06) 25%, transparent 25%),
    linear-gradient(-45deg, rgba(22, 101, 52, 0.06) 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, rgba(22, 101, 52, 0.06) 75%),
    linear-gradient(-45deg, transparent 75%, rgba(22, 101, 52, 0.06) 75%);
  background-size: 56px 56px;
  background-position: 0 0, 0 28px, 28px -28px, -28px 0px;
}

.card-hover {
  transition: transform 180ms ease, box-shadow 180ms ease;
}
.card-hover:hover {
  transform: translateY(-2px);
  box-shadow: 0 16px 30px rgba(29, 38, 59, 0.1);
}

@media print {
  button {
    display: none;
  }
  body {
    background: white;
  }
}
</style>
</head>

<body class="chessboard-bg font-sans text-gray-900">
<div class="max-w-2xl mx-auto bg-white p-10 shadow rounded text-center">

  <h1 class="text-3xl font-bold mb-6">Coach Salary Slip</h1>

  <p class="text-lg mb-2">
    Month: <span id="monthText" class="font-semibold"></span>
  </p>

  <p class="text-xl mt-6">
    Coach Name:
    <span id="coachName" class="font-bold text-gray-800"></span>
  </p>

  <p class="text-3xl font-bold mt-8">
    Total Amount: ₹<span id="totalAmount"></span>
  </p>

  <button onclick="window.print()"
    class="mt-10 bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">
    Download / Print
  </button>

</div>

<script>
document.addEventListener("DOMContentLoaded", async () => {

  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");
  const month = params.get("month");

  if (!id) {
    alert("Invalid Payslip");
    return;
  }

  document.getElementById("monthText").textContent = month;

  try {
    const response = await fetch(`/api/download-payslip/${id}`);
    const data = await response.json();

    document.getElementById("coachName").textContent = data.coachName || "N/A";
    document.getElementById("totalAmount").textContent = data.totalAmount || 0;

  } catch (error) {
    console.error("Error loading payslip:", error);
    alert("Error loading payslip");
  }

});
</script>

</body>
</html>
