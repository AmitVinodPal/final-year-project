<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Coach Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .chessboard-bg {
    background-color: #ecfdf5; /* very light green */
    background-image:
      linear-gradient(45deg, rgba(22, 101, 52, 0.06) 25%, transparent 25%),
      linear-gradient(-45deg, rgba(22, 101, 52, 0.06) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, rgba(22, 101, 52, 0.06) 75%),
      linear-gradient(-45deg, transparent 75%, rgba(22, 101, 52, 0.06) 75%);
    background-size: 56px 56px;
    background-position: 0 0, 0 28px, 28px -28px, -28px 0px;
  }

  .card-hover {
    transition: transform 180ms ease, box-shadow 180ms ease;
  }
  .card-hover:hover {
    transform: translateY(-2px);
    box-shadow: 0 16px 30px rgba(29, 38, 59, 0.1);
  }
</style>

<script>
document.addEventListener("DOMContentLoaded", async () => {

  const teacherId = localStorage.getItem("teacherId");
  const coachName = localStorage.getItem("teacherName");

  document.getElementById("coachName").innerText = coachName || "Coach";

  try {
    const res = await fetch(`/api/sessions?teacherId=${teacherId}`);
    const sessions = await res.json();

    let total = sessions.length;
    let group = 0;
    let oneOnOne = 0;

    sessions.forEach(session => {
      if (session.type === "Group") group++;
      if (session.type === "One-on-One") oneOnOne++;
    });

    document.getElementById("totalSessions").innerText = total;
    document.getElementById("groupSessions").innerText = group;
    document.getElementById("oneOnOneSessions").innerText = oneOnOne;

  } catch (err) {
    console.error("Dashboard fetch error:", err);
  }
});

function logout() {
  window.location.href = "selection.html";
}

function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("-translate-x-full");
}
</script>

</head>

<body class="bg-gray-100">

<!-- MOBILE TOP BAR -->
<div class="md:hidden bg-green-700 text-white flex justify-between items-center p-4">
  <h2 class="font-bold text-lg">Coach Panel</h2>
  <button onclick="toggleSidebar()" class="text-2xl">☰</button>
</div>

<div class="flex">

  <!-- SIDEBAR -->
  <aside id="sidebar"
    class="fixed md:static z-50 w-64 bg-green-700 text-white min-h-screen p-5 space-y-4
           transform -translate-x-full md:translate-x-0 transition duration-300">

    <h2 class="text-2xl font-bold">Coaches Panel</h2>

    <span id="coachName" class="block font-semibold text-green-200"></span>

    <nav class="space-y-1 mt-4">
      <a href="coach-dashboard.html" class="block p-2 rounded hover:bg-green-600">Dashboard</a>
      <a href="coach-sessions.html" class="block p-2 rounded hover:bg-green-600">My Sessions</a>
      <a href="coach-payslips.html" class="block p-2 rounded hover:bg-green-600">Payslips</a>
    </nav>

    <button onclick="logout()"
      class="mt-6 w-full bg-blue-500 py-2 rounded hover:bg-blue-600">
      Logout
    </button>

  </aside>

  <!-- MAIN CONTENT -->
  <main class="flex-1 p-4 sm:p-6 md:p-8 w-full">

    <!-- HEADER -->
    <div class="text-center mb-8">

      <div class="flex flex-col sm:flex-row justify-center items-center gap-3 sm:gap-4">

        <img src="images/logo.jpg"
          class="w-14 sm:w-16 md:w-20"
          alt="Logo">

        <h1 class="text-2xl sm:text-3xl md:text-4xl font-extrabold text-green-900 text-center">
          GURUKUL CHESS ACADEMY
        </h1>

      </div>

      <p class="mt-3 text-base sm:text-lg md:text-xl font-semibold text-gray-800">
        EVERY CHESS MASTER WAS ONCE A BEGINNER
      </p>

      <p class="text-gray-600 font-medium text-sm sm:text-base">
        – IRVING CHERNEV
      </p>

      <div class="flex justify-center items-center mt-6">
        <div class="border-t-2 border-gray-600 w-20 sm:w-40 md:w-64"></div>
        <span class="px-3 text-xl sm:text-2xl text-gray-700">♟</span>
        <div class="border-t-2 border-gray-600 w-20 sm:w-40 md:w-64"></div>
      </div>

    </div>

    <!-- DASHBOARD CARDS -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">

      <div class="bg-white p-5 sm:p-6 text-center rounded shadow">
        <p class="text-gray-500 text-sm sm:text-base">Total Sessions</p>
        <h2 id="totalSessions"
          class="text-2xl sm:text-3xl font-bold text-green-600">
          0
        </h2>
      </div>

      <div class="bg-white p-5 sm:p-6 text-center rounded shadow">
        <p class="text-gray-500 text-sm sm:text-base">Group Sessions</p>
        <h2 id="groupSessions"
          class="text-2xl sm:text-3xl font-bold text-green-600">
          0
        </h2>
      </div>

      <div class="bg-white p-5 sm:p-6 text-center rounded shadow">
        <p class="text-gray-500 text-sm sm:text-base">One-on-One Sessions</p>
        <h2 id="oneOnOneSessions"
          class="text-2xl sm:text-3xl font-bold text-green-600">
          0
        </h2>
      </div>

    </div>

  </main>

</div>

</body>
</html>
